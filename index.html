<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octaves · Brio Music Studio</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#23212b;--mut:#5b6073;--line:#e2e4ec;--bg:#f3f4f8;--card:#fff;
 --ind:#4f46e5;--ind-d:#4338ca;--ind-s:#eef0ff;--ok:#16a34a;--bad:#dc2626;
 --r:18px;--sh:0 1px 2px rgba(35,33,43,.05),0 8px 24px rgba(35,33,43,.06);
 --w:1240px;--gut:24px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:500 1rem/1.55 Montserrat,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,h4{font-family:Montserrat,sans-serif;line-height:1.2}
button,select,input{font-family:inherit}
button,.ov,.wk,.bk{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}

/* ---------- Header (static) ---------- */
header{background:#fff;border-bottom:1px solid var(--line)}
.top{max-width:var(--w);margin:auto;padding:14px var(--gut);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;border:0;background:none;cursor:pointer;color:var(--ink);text-align:left;padding:0;border-radius:12px}
.mark{width:40px;height:40px;border-radius:12px;background:#2a2825;display:grid;place-items:center}
.brand b{display:block;font-size:1.2rem;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:.75rem;font-weight:600;color:var(--mut);margin-top:2px}
.ctl{display:flex;align-items:center;gap:10px}
.lang{height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-weight:600;font-size:.88rem;background:#fff;color:var(--ink);cursor:pointer}
.vol{height:40px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.vol button{border:0;background:none;cursor:pointer;font-size:1.05rem;line-height:1;padding:4px}
.vol input{width:84px;accent-color:var(--ind)}
.navw{max-width:var(--w);margin:auto;padding:0 var(--gut)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;white-space:nowrap;padding:12px 16px;font-weight:600;font-size:.92rem;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ind);border-bottom-color:var(--ind)}

/* ---------- Layout ---------- */
main{flex:1;width:100%;max-width:var(--w);margin:0 auto;padding:32px var(--gut) 48px}
.pg{display:none}.pg.on{display:block;animation:fi .25s ease}
@keyframes fi{from{opacity:0}}
.pg>.card{max-width:100%}
#home{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px;box-shadow:var(--sh)}
.narrow{max-width:960px;margin:0 auto}
.ph{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.ph h1{font-size:clamp(1.5rem,3vw,1.9rem);font-weight:800;letter-spacing:-.015em}
.ph p{color:var(--mut);margin-top:6px;max-width:64ch}
.ch h2{font-size:1.4rem;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mut);margin:6px 0 0;max-width:64ch}

/* ---------- Home hero ---------- */
.hero{background:#2a2825;color:#fff;border-radius:var(--r);padding:44px 40px 36px;box-shadow:var(--sh)}
.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.025em}
.lead{font-size:clamp(1.05rem,2vw,1.3rem);line-height:1.5;color:#e7e5e0;max-width:44ch;margin-top:12px}
.notes{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.nt{min-width:64px;padding:12px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;transition:background .15s,border-color .15s}
.nt:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5)}
.nt.pl{animation:ntp .35s}@keyframes ntp{40%{background:var(--ind);border-color:var(--ind);transform:translateY(2px)}}
.hnote{margin-top:14px;font-size:.88rem;color:#b9b6ae}

/* ---------- Section tiles ---------- */
.sh{font-size:1.4rem;font-weight:800;letter-spacing:-.01em;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:24px;border-radius:var(--r);border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;box-shadow:var(--sh);transition:border-color .18s,box-shadow .18s,transform .18s}
.tile:hover{border-color:var(--tc);box-shadow:0 12px 30px rgba(35,33,43,.12);transform:translateY(-3px)}
.ti{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--tb);color:var(--tc)}
.tx b{display:block;font-size:1.15rem;font-weight:800;letter-spacing:-.01em;margin-bottom:6px;line-height:1.25}
.tx span{display:block;min-height:4.35em;font-size:.88rem;line-height:1.45;color:var(--mut);font-weight:500;padding-right:28px}
.go{position:absolute;right:20px;bottom:22px;color:var(--tc);transition:transform .18s}
.tile:hover .go{transform:translateX(4px)}

/* ---------- Piano ---------- */
.kbw{overflow-x:auto;padding:46px 2px 12px;margin-top:8px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.kbs{position:relative;min-width:var(--mw,1080px)}
.kb{display:flex;background:#23212b;padding:6px 4px 0;border-radius:12px;box-shadow:0 10px 24px rgba(35,33,43,.28);user-select:none}
.wk{flex:1;position:relative;height:160px;background:linear-gradient(#fff,#f1f1f5);border:1px solid #cfd0dc;border-top:0;border-radius:0 0 6px 6px;box-shadow:inset 0 -4px 6px rgba(0,0,0,.07)}
.wk.in{background:linear-gradient(#d3d9ff,#b4bffa)}
.wk.on{background:#ddd6fe}
.bk{position:absolute;top:0;right:-30%;width:60%;height:62%;z-index:5;background:linear-gradient(#3b3a48,#0b0b10);border-radius:0 0 4px 4px;box-shadow:2px 3px 5px rgba(0,0,0,.4)}
.lb{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:800 .64rem Montserrat,system-ui,sans-serif;color:var(--ind);pointer-events:none}
.ov{position:absolute;top:0;bottom:0;z-index:20;cursor:pointer;border:2px solid transparent;border-radius:8px;transition:background .2s,border-color .2s;--h:240}
.ov:hover,.ov.hl{background:hsl(var(--h) 85% 55%/.28);border-color:hsl(var(--h) 75% 45%)}
.ov.good{background:rgba(34,197,94,.42);border-color:#16a34a}.ov.bad{background:rgba(239,68,68,.42);border-color:#dc2626}
/* octave names: hidden by default, shown only in .tt (home always, names-quiz only after the hint) */
.ot{position:absolute;top:-36px;left:0;right:0;text-align:center;font:800 .88rem Montserrat,system-ui,sans-serif;color:#3730a3;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.tt .ot{opacity:1}
.tt .ov:hover .ot{transform:scale(1.18);color:hsl(var(--h) 75% 36%)}
.touch{display:none;color:var(--mut);font-size:.85rem;margin-top:6px}

/* ---------- Mini keyboards (octave limits) ---------- */
.mini .kb{padding:4px 3px 0;border-radius:8px;box-shadow:0 4px 10px rgba(35,33,43,.22)}
.mini .wk{height:clamp(72px,8vw,104px)}.mini .bk{height:60%}

/* ---------- Quiz ---------- */
.qtop{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--mut);font-size:.92rem;margin-bottom:10px}
.score{display:flex;gap:8px}.score b{padding:3px 12px;border-radius:99px;font-weight:700}.g{background:#dcfce7;color:#15803d}.r{background:#fee2e2;color:#b91c1c}
.bar{height:6px;background:#e5e7f0;border-radius:9px;overflow:hidden;margin-bottom:28px}.bar i{display:block;height:100%;background:var(--ind);border-radius:9px;transition:width .4s}
.qq{font-size:clamp(1.25rem,2.6vw,1.65rem);font-weight:800;letter-spacing:-.01em;margin-bottom:22px}
.qq.big2{margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.opts.kbopts{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.opt{font:700 1.08rem Montserrat,system-ui,sans-serif;padding:18px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);transition:border-color .15s,box-shadow .15s,transform .15s}
.opt:hover{border-color:var(--ind);box-shadow:0 8px 20px rgba(79,70,229,.14);transform:translateY(-2px)}
.kbopts .opt{padding:16px}
.opt *{pointer-events:none}
.opt.good{background:#dcfce7;border-color:var(--ok)}.opt.bad{background:#fee2e2;border-color:var(--bad);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tools{display:flex;gap:12px;margin:14px 0 4px}

.btn{border:0;cursor:pointer;font:700 1rem Montserrat,system-ui,sans-serif;color:#fff;padding:13px 28px;border-radius:12px;background:var(--ind);box-shadow:0 6px 16px rgba(79,70,229,.28);transition:background .15s,transform .15s}
.btn:hover{background:var(--ind-d);transform:translateY(-1px)}
.btn.alt{background:#fff;color:var(--ind);border:1.5px solid #c7ccf7;box-shadow:none}.btn.alt:hover{background:var(--ind-s)}
.btn.lg{font-size:1.1rem;padding:16px 44px}
.res{text-align:center;padding:12px 0}
.res .big{font-size:4.2rem;font-weight:800;color:var(--ind);letter-spacing:-.02em;line-height:1.1}
.res p{font-size:1.2rem;font-weight:600;margin:12px 0 26px}
.res .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.verdict{font-size:1.8rem;font-weight:800;color:var(--ind);margin-bottom:24px}

/* ---------- Feedback overlay ---------- */
#fb{position:fixed;inset:0;z-index:100;display:none;place-items:center;pointer-events:none}
#fb.show{display:grid}
#fb svg{width:170px;height:170px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35));animation:pop 1s forwards}
#fb path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .45s .15s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes pop{0%{transform:scale(0)}25%{transform:scale(1.15)}40%,75%{transform:scale(1)}100%{transform:scale(1.4);opacity:0}}
#fb.x svg{animation:xs .9s forwards}@keyframes xs{0%{transform:scale(0)}20%{transform:scale(1.2)}35%{transform:scale(1.2) translateX(-16px)}50%{transform:scale(1.2) translateX(16px)}65%{transform:scale(1.2) translateX(-8px)}100%{transform:scale(1);opacity:0}}

/* ---------- Game ---------- */
.setup{max-width:640px}
.fld{margin-bottom:28px}
.fld h4{font-size:1rem;font-weight:700;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 20px;font:700 .95rem Montserrat,system-ui,sans-serif;cursor:pointer;color:var(--ink);transition:.15s}
.chip:hover{border-color:var(--ind)}
.chip.on{background:var(--ind);color:#fff;border-color:var(--ind)}
.own{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin-top:16px}
.ownl{font-weight:600;color:var(--mut);margin-right:4px}
.num{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--mut)}
.num input{width:76px;height:44px;padding:0 10px;border-radius:12px;border:1.5px solid var(--line);font:700 1.05rem Montserrat,system-ui,sans-serif;text-align:center;color:var(--ink);background:#fff}
.num input:focus{outline:none;border-color:var(--ind);box-shadow:0 0 0 3px #dfe2fd}
.rng{width:100%;font-size:.82rem;color:var(--mut)}
.sw{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;background:#f6f6fb;border:1px solid var(--line);cursor:pointer;font-weight:500;font-size:.95rem;line-height:1.45}
.sw+.sw{margin-top:10px}
.sw input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ind)}
.act{margin-top:8px}
.hud{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.timer{font:800 2rem Montserrat,system-ui,sans-serif;font-variant-numeric:tabular-nums;background:#23212b;color:#fff;padding:6px 24px;border-radius:12px;min-width:120px;text-align:center}
.timer.low{background:var(--bad);animation:pl2 1s infinite}@keyframes pl2{50%{opacity:.7}}
#q4 .target{display:block;width:fit-content;margin:0 auto 8px;text-align:center;font:800 clamp(1.4rem,3.6vw,2.2rem) Montserrat,system-ui,sans-serif;padding:16px 32px;border-radius:16px;background:var(--ind-s);border:1.5px solid #c7ccf7}
.target em{font-style:normal;color:var(--ind)}
.jg{display:flex;justify-content:center;gap:28px;margin:22px 0}
.jg button{width:104px;height:104px;border-radius:50%;border:0;cursor:pointer;font-size:3rem;color:#fff;box-shadow:0 10px 22px rgba(0,0,0,.22);transition:.15s}.jg button:active{transform:scale(.93)}
.modal{position:fixed;inset:0;z-index:90;background:rgba(35,33,43,.6);display:grid;place-items:center;padding:16px}
.modalc{max-width:480px;width:100%;padding:36px 28px}
.modalc h2{font-size:1.6rem;font-weight:800}

/* ---------- Footer (compact) ---------- */
footer{background:#fff;border-top:1px solid var(--line)}
.fin{max-width:var(--w);margin:auto;padding:14px var(--gut);display:flex;align-items:center;justify-content:space-between;gap:16px}
.fl{display:flex;align-items:center;gap:16px;min-width:0}
.flogo{height:30px;width:auto;display:block;flex:none}
.copy{font-size:.8rem;font-weight:500;color:var(--mut);padding-left:16px;border-left:1px solid var(--line)}
.soc{display:flex;gap:8px}
.soc a{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mut);border:1px solid var(--line);transition:.15s}
.soc a:hover{background:var(--ind);border-color:var(--ind);color:#fff}
.soc svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Responsive ---------- */
@media(max-width:1000px){.tiles{grid-template-columns:repeat(2,1fr)}.tile{aspect-ratio:auto;min-height:210px;gap:28px}}
@media(max-width:640px){
 :root{--gut:14px}
 .top{padding:10px var(--gut)}.brand small{display:none}.brand b{font-size:1.1rem}.mark{width:36px;height:36px}
 .vol input{display:none}.vol{padding:0 6px}.lang{padding:0 8px;font-size:.82rem}.ctl{gap:6px}
 nav button{padding:12px 12px}nav button svg{display:none}
 main{padding:18px var(--gut) 32px}
 .card{padding:20px 16px;border-radius:16px}
 .hero{padding:28px 20px 24px}.nt{min-width:0;flex:1 1 calc(25% - 10px);padding:12px 8px}
 .wk{height:124px}
 .tiles{gap:12px}.tile{padding:16px;min-height:190px}.ti{width:44px;height:44px}.tx b{font-size:1rem}.tx span{font-size:.8rem;padding-right:0}.go{display:none}
 .opts,.opts.kbopts{grid-template-columns:1fr}.kbopts{max-width:420px;margin:0 auto}
 .opt{padding:15px 10px;font-size:1rem}
 .touch{display:block}.timer{font-size:1.6rem}.res .big{font-size:3rem}.jg button{width:88px;height:88px}
 .fin{flex-wrap:wrap;padding:12px var(--gut)}.copy{border:0;padding:0;flex-basis:100%;order:3}.fl{flex-wrap:wrap;gap:8px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 </div>
</div></footer>

let L='uk';
const LG={
uk:{nh:'Головна',n0:'Перевір себе',n1:'Межі октави',n2:'Назви октав',n3:'Гра на швидкість',sec_h:'Розділи',sev:'Сім нот однієї октави. Натисни на ноту, щоб почути її.',
d0:'П’ять запитань, щоб закріпити, що таке октава.',d1:'Визнач, де октава починається і де закінчується.',d2:'Вивчи назви октав — від контроктави до четвертої.',d3:'Шукай названі ноти на клавіатурі, поки йде час.',

h0:'Уся клавіатура',h0d:'Наведи курсор (або торкнись) на октаву — вона підсвітиться та зазвучить.',swipe:'👉 Клавіатуру можна гортати вбік. Зручніше повернути телефон горизонтально.',defw:'Октава',defd:'послідовна частина клавіатури від ноти ДО до ноти СІ.',qh:'Перевір себе',qn:'Питання {a} з {b}',
a1:'Скільки нот в одній октаві?',a2:'Чи є октавою ноти від {x} до {y}?',yes2:'Так, це октава',no2:'Ні, це лише частина октави',a3:'Яка послідовність нот в октаві правильна?',a4:'З якої ноти починається октава?',a5:'Якою нотою закінчується октава?',
